version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: world_explorer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worldexplorer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worldexplorer_secret}
      POSTGRES_DB: ${POSTGRES_DB:-world_explorer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worldexplorer} -d ${POSTGRES_DB:-world_explorer}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
